{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts — Torch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{%static 'css/blog/posts.css' %}">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a href="/" class="brand">
      <span class="brand__mark">T</span>
      <span class="brand__name">Torch</span>
    </a>
    <nav class="topbar__nav">
      <a href="/">Home</a>
      <a href="/posts.html" class="is-active">Posts</a>
      <a href="/project.html">About</a>
    </nav>
    <div class="topbar__auth" id="topbar-auth">
      <!-- Filled by JS. Shows "Login" when anonymous, avatar + menu when logged in. -->
    </div>
  </div>
</header>

<main class="page">

  <header class="page__header">
    <h1 class="page__title">All posts</h1>
    <p class="page__subtitle" id="result-count">&nbsp;</p>
  </header>

  <div class="layout">

    <!-- ============================================================
         Sidebar
         ============================================================ -->
    <aside class="sidebar" aria-label="Filters">

      <div class="filters">

        <div class="filters__group">
          <label class="filters__label" for="filter-search">Search</label>
          <div class="input-with-icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <input type="search" id="filter-search" placeholder="Title, summary…" autocomplete="off">
          </div>
        </div>

        <div class="filters__group">
          <label class="filters__label" for="filter-category">Category</label>
          <select id="filter-category">
            <option value="">All categories</option>
          </select>
        </div>

        <div class="filters__group">
          <label class="filters__label" for="filter-tag">Tag</label>
          <select id="filter-tag">
            <option value="">All tags</option>
          </select>
        </div>

        <div class="filters__group">
          <label class="filters__label" for="filter-ordering">Sort by</label>
          <select id="filter-ordering">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="most_viewed">Most viewed</option>
            <option value="most_liked">Most liked</option>
            <option value="most_commented">Most commented</option>
            <option value="title_asc">Title A–Z</option>
          </select>
        </div>

        <div class="filters__group filters__group--pagesize">
          <label class="filters__label" for="filter-pagesize">Per page</label>
          <select id="filter-pagesize">
            <option value="12" selected>12</option>
            <option value="24">24</option>
            <option value="48">48</option>
          </select>
        </div>

        <button type="button" id="filters-clear" class="btn btn--ghost">
          Clear all filters
        </button>

      </div>
    </aside>

    <!-- ============================================================
         Content
         ============================================================ -->
    <section class="content" aria-live="polite">

      <div id="post-grid" class="post-grid"></div>

      <div id="skeleton" class="post-grid" hidden>
        <!-- Skeleton cards injected by JS -->
      </div>

      <div id="state-empty" class="state" hidden>
        <p class="state__title">No posts match your filters</p>
        <p class="state__hint">Try removing a filter or widening the search.</p>
        <button class="btn btn--primary" data-clear>Reset filters</button>
      </div>

      <div id="state-error" class="state state--error" hidden>
        <p class="state__title">Couldn't load posts</p>
        <p class="state__hint" id="state-error-message"></p>
        <button class="btn btn--primary" id="state-error-retry">Retry</button>
      </div>

      <nav id="pagination" class="pagination" hidden aria-label="Pagination"></nav>

    </section>

  </div>
</main>

<footer class="footer">
  <div class="footer__inner">
    <span>&copy; <span id="footer-year"></span> Torch</span>
    <span>Built with Django</span>
  </div>
</footer>

<script src="{%static 'js/api.js' %}"></script>
<script src="{%static 'js/blog/posts.js' %}"></script>
</body>
</html>
