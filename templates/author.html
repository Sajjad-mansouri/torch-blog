{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Author — Torch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/blog/posts.css' %}">
  <link rel="stylesheet" href="{% static 'css/blog/author.css' %}">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">

    <div class="topbar__left">
      <button
        type="button"
        class="topbar__menu-btn"
        id="topbar-menu-btn"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="topbar-menu"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>

      <a href="/" class="brand" aria-label="Torch home">
        <span class="brand__mark">T</span>
        <span class="brand__name">Torch</span>
      </a>

      <nav class="topbar__nav" aria-label="Primary">
        <a href="/home/">Home</a>
        <a href="/posts/">Posts</a>
        <a href="/about/">About</a>
      </nav>
    </div>

    <div class="topbar__search" id="topbar-search">
      <form class="search-form" id="search-form" role="search" autocomplete="off">
        <div class="search-form__input-wrap">
          <svg class="search-form__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <input
            type="search"
            id="search-input"
            class="search-form__input"
            placeholder="Search posts, tags, authors…"
            aria-label="Search"
            aria-autocomplete="list"
            aria-controls="search-suggest"
            aria-expanded="false"
          >
          <button type="button" class="search-form__clear" id="search-clear" hidden aria-label="Clear search">×</button>
        </div>
        <div class="search-suggest" id="search-suggest" hidden role="listbox"></div>
      </form>
    </div>

    <div class="topbar__auth" id="topbar-auth"></div>
  </div>

  <nav
    class="topbar__menu"
    id="topbar-menu"
    aria-label="Mobile navigation"
    hidden
  >
    <a href="/home/">Home</a>
    <a href="/posts/">Posts</a>
    <a href="/about/">About</a>
  </nav>
</header>

<main class="page page--author">

  <!-- ============================================================
       Skeleton
       ============================================================ -->
  <div id="author-skeleton" class="author-skeleton">
    <div class="author-skeleton__hero">
      <div class="sk-avatar"></div>
      <div class="sk-lines">
        <div class="sk-line sk-line--lg"></div>
        <div class="sk-line sk-line--md"></div>
        <div class="sk-line sk-line--xl"></div>
      </div>
    </div>
    <div class="author-skeleton__stats">
      <div class="sk-stat"></div>
      <div class="sk-stat"></div>
      <div class="sk-stat"></div>
      <div class="sk-stat"></div>
      <div class="sk-stat"></div>
    </div>
  </div>

  <!-- ============================================================
       Error state
       ============================================================ -->
  <div id="author-error" class="state state--error" hidden>
    <p class="state__title" id="author-error-title">Author not found</p>
    <p class="state__hint" id="author-error-message"></p>
    <a href="/posts/" class="btn btn--primary">Browse all posts</a>
  </div>

  <!-- ============================================================
       Author header
       ============================================================ -->
  <header id="author-header" class="author-header" hidden>
    <div class="author-header__main">
      <img
        id="author-avatar"
        class="author-header__avatar"
        src=""
        alt=""
      >
      <div class="author-header__meta">
        <h1 class="author-header__name" id="author-name"></h1>
        <p class="author-header__handle" id="author-handle"></p>

        <p class="author-header__bio" id="author-bio" hidden></p>

        <div class="author-header__links" id="author-links" hidden></div>
      </div>
    </div>

    <!-- Stats row -->
    <div class="author-stats" id="author-stats" hidden>
      <div class="author-stats__item">
        <span class="author-stats__value" id="stat-posts">0</span>
        <span class="author-stats__label">Posts</span>
      </div>
      <div class="author-stats__item">
        <span class="author-stats__value" id="stat-views">0</span>
        <span class="author-stats__label">Views</span>
      </div>
      <div class="author-stats__item">
        <span class="author-stats__value" id="stat-likes">0</span>
        <span class="author-stats__label">Likes</span>
      </div>
      <div class="author-stats__item">
        <span class="author-stats__value" id="stat-comments">0</span>
        <span class="author-stats__label">Comments</span>
      </div>
      <div class="author-stats__item">
        <span class="author-stats__value" id="stat-bookmarks">0</span>
        <span class="author-stats__label">Bookmarks</span>
      </div>
    </div>
  </header>

  <!-- ============================================================
       Recent posts (from the profile endpoint)
       ============================================================ -->
  <section id="recent-section" class="author-section" hidden>
    <header class="author-section__header">
      <h2 class="author-section__title">Recent posts</h2>
    </header>
    <div class="post-grid" id="recent-grid"></div>
  </section>

  <!-- ============================================================
       All posts (paginated)
       ============================================================ -->
  <section id="all-section" class="author-section" hidden>
    <header class="author-section__header">
      <h2 class="author-section__title" id="all-title">All posts</h2>
      <span class="author-section__count" id="all-count"></span>
    </header>

    <div class="post-grid" id="all-grid"></div>

    <div class="author-section__more" id="all-more" hidden>
      <button type="button" class="btn btn--ghost" id="all-load-more">
        Load more
      </button>
    </div>

    <div id="all-empty" class="state" hidden>
      <p class="state__title">No posts yet</p>
      <p class="state__hint">
        This author hasn't published anything yet. Check back soon.
      </p>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer__inner">
    <span>&copy; <span id="footer-year"></span> Torch</span>
    <span>Built with Django</span>
  </div>
</footer>



<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/blog/posts.js' %}"></script>
<script src="{% static 'js/blog/search.js' %}"></script>
<script src="{% static 'js/topbar.js' %}"></script>
<script src="{% static 'js/blog/author.js' %}"></script>

</body>
</html>
