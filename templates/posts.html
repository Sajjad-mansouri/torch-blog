{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts — Torch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/blog/posts.css' %}">

</head>
<body>

<header class="topbar">
  <div class="topbar__inner">

    <div class="topbar__left">
      <button
        type="button"
        class="topbar__menu-btn"
        id="topbar-menu-btn"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="topbar-menu"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>

      <a href="/" class="brand" aria-label="Torch home">
        <span class="brand__mark">T</span>
        <span class="brand__name">Torch</span>
      </a>

      <nav class="topbar__nav" aria-label="Primary">
        <a href="/home/">Home</a>
        <a href="/posts/" class="is-active">Posts</a>
        <a href="/about/">About</a>
      </nav>
    </div>

    <div class="topbar__search" id="topbar-search">
      <form class="search-form" id="search-form" role="search" autocomplete="off">
        <div class="search-form__input-wrap">
          <svg class="search-form__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <input
            type="search"
            id="search-input"
            class="search-form__input"
            placeholder="Search posts, tags, authors…"
            aria-label="Search"
            aria-autocomplete="list"
            aria-controls="search-suggest"
            aria-expanded="false"
          >
          <button type="button" class="search-form__clear" id="search-clear" hidden aria-label="Clear search">×</button>
        </div>
        <div class="search-suggest" id="search-suggest" hidden role="listbox"></div>
      </form>
    </div>

    <div class="topbar__auth" id="topbar-auth"></div>
  </div>

  <nav
    class="topbar__menu"
    id="topbar-menu"
    aria-label="Mobile navigation"
    hidden
  >
    <a href="/home/">Home</a>
    <a href="/posts/" class="is-active">Posts</a>
    <a href="/about/">About</a>
  </nav>
</header>

<main class="page">

  <header class="page__header">
    <h1 class="page__title">All posts</h1>
    <p class="page__subtitle" id="result-count">&nbsp;</p>
  </header>

  <button
    type="button"
    class="filters-toggle"
    id="filters-toggle"
    aria-expanded="false"
    aria-controls="filters-panel"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round">
      <line x1="4" y1="6" x2="20" y2="6"/>
      <line x1="7" y1="12" x2="17" y2="12"/>
      <line x1="10" y1="18" x2="14" y2="18"/>
    </svg>
    <span>Filters</span>
    <span class="filters-toggle__chevron" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </span>
  </button>

  <div class="layout">

    <aside
      class="sidebar"
      id="filters-panel"
      aria-label="Filters"
    >
      <div class="filters">

        <div class="filters__group">
          <label class="filters__label" for="filter-search">Search</label>
          <div class="input-with-icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <input type="search" id="filter-search" placeholder="Title, summary…" autocomplete="off">
          </div>
        </div>

        <div class="filters__group">
          <label class="filters__label" for="filter-category">Category</label>
          <select id="filter-category">
            <option value="">All categories</option>
          </select>
        </div>

        <div class="filters__group">
          <label class="filters__label" for="filter-tag">Tag</label>
          <select id="filter-tag">
            <option value="">All tags</option>
          </select>
        </div>

        <div class="filters__group">
          <label class="filters__label" for="filter-ordering">Sort by</label>
          <select id="filter-ordering">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="most_viewed">Most viewed</option>
            <option value="most_liked">Most liked</option>
            <option value="most_commented">Most commented</option>
            <option value="title_asc">Title A–Z</option>
          </select>
        </div>

        <div class="filters__group filters__group--pagesize">
          <label class="filters__label" for="filter-pagesize">Per page</label>
          <select id="filter-pagesize">
            <option value="12" selected>12</option>
            <option value="24">24</option>
            <option value="48">48</option>
          </select>
        </div>

        <button type="button" id="filters-clear" class="btn btn--ghost">
          Clear all filters
        </button>

      </div>
    </aside>

    <section class="content" aria-live="polite">

      <div id="post-grid" class="post-grid"></div>

      <div id="skeleton" class="post-grid" hidden></div>

      <div id="state-empty" class="state" hidden>
        <p class="state__title">No posts match your filters</p>
        <p class="state__hint">Try removing a filter or widening the search.</p>
        <button class="btn btn--primary" data-clear>Reset filters</button>
      </div>

      <div id="state-error" class="state state--error" hidden>
        <p class="state__title">Couldn't load posts</p>
        <p class="state__hint" id="state-error-message"></p>
        <button class="btn btn--primary" id="state-error-retry">Retry</button>
      </div>

      <nav id="pagination" class="pagination" hidden aria-label="Pagination"></nav>

    </section>

  </div>
</main>

<footer class="footer">
  <div class="footer__inner">
    <span>&copy; <span id="footer-year"></span> Torch</span>
    <span>Built with Django</span>
  </div>
</footer>


<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/blog/posts.js' %}"></script>
<script src="{% static 'js/blog/search.js' %}"></script>
<script src="{% static 'js/topbar.js' %}"></script>

</body>
</html>
